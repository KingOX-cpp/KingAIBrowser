[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kingai-browser"
version = "0.3.3"
description = "Fingerprint browser SDK for AI agents and persistent multi-account automation over stdio MCP"
readme = "PYPI_README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.10"
keywords = ["antidetect", "browser-automation", "mcp", "ai-agent", "fingerprint", "multi-account", "chromium"]
dependencies = []

[project.urls]
Homepage = "https://www.kingaibrowser.cn"
Repository = "https://github.com/KingOX-cpp/KingAIBrowser"
Issues = "https://github.com/KingOX-cpp/KingAIBrowser/issues"

[tool.setuptools]
py-modules = ["kingai_browser", "_kingai_stdio", "_kingai_discovery", "_kingai_automation", "_kingai_async", "_kingai_doctor", "_kingai_installer"]

[project.scripts]
kingai-browser = "kingai_browser:main"

